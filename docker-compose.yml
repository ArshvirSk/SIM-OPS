version: "2.4"

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_ML_SERVICE_URL: ${NEXT_PUBLIC_ML_SERVICE_URL}
    image: simops-app:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_ML_SERVICE_URL: ${NEXT_PUBLIC_ML_SERVICE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - ml

  ml:
    build:
      context: ./ml-service
    image: simops-ml-service:latest
    ports:
      - "8000:8000"

  scheduler:
    image: simops-app:latest
    command: ["node", "local-scheduler.js"]
    env_file:
      - .env
    environment:
      BASE_URL: http://app:3000
    depends_on:
      - app
    restart: unless-stopped
